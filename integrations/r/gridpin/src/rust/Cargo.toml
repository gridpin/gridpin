# The C interface crate gridpin-ffi (gridpin-ffi/ in the GridPin repository), built against
# the released engine from crates.io. src/ is a verbatim copy of gridpin-ffi/src, kept equal by the
# repository checks.
[package]
name = "gridpin-ffi"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "gridpin_ffi"
crate-type = ["staticlib"]

[dependencies]
gridpin = "=0.6.0"
serde = "1"
serde_json = "1"

[profile.release]
lto = "thin"

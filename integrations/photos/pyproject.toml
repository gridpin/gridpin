[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpin-photos"
version = "0.1.0"
description = "Captions of place for a folder of photos, offline: the GPS point in each photo, the nearest address on a GridPin file, a CSV and optional .xmp beside the photos"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["photos", "exif", "reverse-geocoding", "offline", "xmp", "geotag"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Topic :: Multimedia :: Graphics"]
# exifread (BSD-3-Clause, pure Python) reads the GPS block; the engine and the sheet come from the gridpin wheel.
dependencies = ["gridpin>=0.9,<0.11", "exifread>=3.0"]

[project.scripts]
gridpin-photos = "gridpin_photos:_entry"

[project.urls]
Homepage = "https://gridpin.dev"
Documentation = "https://gridpin.dev/docs"
Repository = "https://github.com/gridpin/gridpin"
Issues = "https://github.com/gridpin/gridpin/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gridpin_photos = ["py.typed"]

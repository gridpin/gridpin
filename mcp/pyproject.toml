[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpin-mcp"
version = "0.3.0"
description = "MCP server for offline geocoding with GridPin: addresses to coordinates and back from one local file per country, no API key"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["mcp", "geocoding", "geocoder", "offline", "reverse-geocoding", "gis", "overture", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["gridpin>=0.6.0,<0.7", "mcp>=2.3,<3", "typing-extensions>=4.13"]

[project.urls]
Homepage = "https://gridpin.dev"
Documentation = "https://gridpin.dev/docs"
Repository = "https://github.com/gridpin/gridpin"
Issues = "https://github.com/gridpin/gridpin/issues"

[project.scripts]
gridpin-mcp = "gridpin_mcp.cli:serve"
gridpin-fetch = "gridpin_mcp.cli:fetch_main"

[tool.setuptools.packages.find]
where = ["src"]

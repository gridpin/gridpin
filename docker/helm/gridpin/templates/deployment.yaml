{{- range .Values.countries }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gridpin-{{ . }}
  labels: {app: gridpin, country: "{{ . }}"}
spec:
  replicas: {{ $.Values.replicas }}
  selector:
    matchLabels: {app: gridpin, country: "{{ . }}"}
  template:
    metadata:
      labels: {app: gridpin, country: "{{ . }}"}
    spec:
      containers:
        - name: gridpin
          image: "{{ $.Values.image.repository }}:{{ . }}-{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports: [{containerPort: {{ $.Values.port }}}]
          readinessProbe:
            exec: {command: ["/usr/local/bin/gridpin", "serve", "--probe", "http://127.0.0.1:{{ $.Values.port }}/health"]}
            periodSeconds: 10
          resources: {{- toYaml $.Values.resources | nindent 12 }}
---
{{- end }}

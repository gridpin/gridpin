[package]
name = "gridpin_ext"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
gridpin = { path = "../gridpin" }
serde = "1"
serde_json = "1"

[features]
# extra answer fields: on with the engine release that has them (gridpin-ffi turns it on by default)
extras = []

[profile.release]
lto = "thin"

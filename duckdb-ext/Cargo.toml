[package]
name = "gridpin_ext"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
duckdb = { version = "~1.10503.1", features = ["loadable-extension", "vscalar"] }
gridpin = { path = "../gridpin" }
serde_json = "1"

[profile.release]
lto = "thin"

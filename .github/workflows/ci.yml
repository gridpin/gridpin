# gridpin CI: build + tests on 3 OSes, plus a Monaco smoke test that exercises the
# full pipeline (OSM download -> prep -> build -> live queries). The smoke test runs
# on built-in defaults, which also covers the engine's fallback path.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo and runs tests — it never writes releases or uses OIDC. Default every job
# to read-only so a compromised action cannot push contents or mint tokens.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.93.0"  # pinned: a floating input can change the build between runs
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: gridpin
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # ≥21: the test runner expands the `*.test.js` glob ITSELF. On windows-latest the
          # default shell is pwsh, which does not expand globs — with node 20 the pattern
          # would reach the runner as a literal path and match nothing.
          node-version: "22"
      - name: Build
        run: cargo build --release --manifest-path gridpin/Cargo.toml
      - name: Engine tests (default + watermark feature)
        run: |
          cargo test --manifest-path gridpin/Cargo.toml
      - name: DuckDB extension unit tests (no_panic / poisoned lock)
        run: cargo test --manifest-path duckdb-ext/Cargo.toml
      - name: C interface (a C program built against gridpin.h and the static library)
        run: cargo test --manifest-path gridpin-ffi/Cargo.toml
  # Formatting and lint gate : both Rust trees must be rustfmt-clean and pass
  # clippy with no warnings, including the watermark feature path.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.93.0"  # pinned: a floating input can change the build between runs
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: gridpin
      - name: rustfmt
        run: |
          cargo fmt --check --manifest-path gridpin/Cargo.toml
          cargo fmt --check --manifest-path duckdb-ext/Cargo.toml
          cargo fmt --check --manifest-path gridpin-ffi/Cargo.toml
      - name: clippy (deny warnings)
        run: |
          cargo clippy --manifest-path gridpin/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path duckdb-ext/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path gridpin-ffi/Cargo.toml --all-targets -- -D warnings

  # Supply-chain gate (plan-security stage 1): dependency advisories, license
  # allowlist and registry sources for both crates, config in deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: gridpin/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: duckdb-ext/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: gridpin-ffi/Cargo.toml

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.93.0"  # pinned: a floating input can change the build between runs
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: gridpin
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install DuckDB (used by the prep/ pipeline)
        run: pip install duckdb==1.5.3  # pinned: a floating input can change the build between runs
      - name: Public benchmark contracts (offline, fail-closed, mutation proof)
        run: make public-bench-contract
      - name: Smoke test (Monaco from scratch — pipeline + engine + queries)
        run: make smoke

  # Exercise the production interfaces — Python wheel and DuckDB extension — against the
  # Monaco smoke sheet, so a Rust API change that breaks a binding fails the PR (not only
  # the release). Linux only: needs the .venv-py/maturin + extension-ci-tools setup.
  interfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.93.0"  # pinned: a floating input can change the build between runs
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: gridpin
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tooling (maturin, pytest, duckdb, pycountry, extension-ci-tools)
        run: |
          python -m venv .venv-py
          # pyyaml: the release-packaging contract test parses the workflow YAML to hold the
          # packaging/permissions contract. pycountry is the ISO source used by the country-vote
          # generator exercised by the whole-directory tools test below. Both are pinned like the
          # rest so a clean CI runner observes the same inputs as the local gate.
          .venv-py/bin/pip install --quiet maturin==1.14.0 pytest==9.1.1 duckdb==1.5.3 pyyaml==6.0.3 pycountry==24.6.1 pandas==2.3.3 geopy==2.5.0 polars==2.1.0 pandera==0.35.0  # pinned: a floating input can change the build between runs
          # polars and pandera: gridpin.polars and the pandera check of gridpin.dq (gridpin/tests/test_polars_dq.py, §304)
          # `make mc` runs the prep/ pipeline with the SYSTEM python3 — it needs duckdb too
          pip install --quiet duckdb==1.5.3
          git clone https://github.com/duckdb/extension-ci-tools duckdb-ext/extension-ci-tools
          git -C duckdb-ext/extension-ci-tools checkout 5cad6aa9886a8ec6c9dbb772bed6fdae67c42d64  # pinned: a floating input can change the build between runs
      - name: Build the Monaco smoke sheet
        run: make mc
      - name: Python bindings and DuckDB extension tests
        run: make test-py
      - name: LangChain integration package tests (integrations/langchain)
        # Its own venv: langchain-tests brings pytest plugins that must not load into .venv-py.
        run: make langchain-venv test-langchain
      - name: QGIS plugin tests (integrations/qgis, QGIS LTR and current release in Docker)
        run: make test-qgis

  # The loadable SQLite extension on the four platforms the release ships (ANSWERS §304 p. 2): the same build.sh and
  # pinned header as the release job `sqlite`, so a pull request proves the release build first (PRINCIPLES 5.4-bis,
  # sixth source). Linux and macOS also run the extension's tests on the Monaco smoke sheet.
  sqlite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.93.0"  # pinned: a floating input can change the build between runs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: SQLite header (amalgamation 3.54.1, pinned by checksum)
        run: python3 .github/sqlite_header.py "$RUNNER_TEMP/sqlite"
      - name: Build the extension
        run: SQLITE_INCLUDE="$RUNNER_TEMP/sqlite" sh integrations/sqlite/build.sh
      - name: SQLite module with extension loading (macOS — the runner's Python is built without it)
        if: runner.os == 'macOS'
        run: python3 -m pip install --quiet sqlean.py==3.50.4.5  # pinned: a floating input can change the build between runs
      - name: Smoke — the extension loads and its engine answers
        run: python3 .github/sqlite_smoke.py integrations/sqlite
      - name: Tests on the Monaco smoke sheet
        if: runner.os != 'Windows'
        run: |
          pip install --quiet duckdb==1.5.3 pytest==9.1.1  # pinned: a floating input can change the build between runs
          make mc
          python3 -m pytest integrations/sqlite/tests -q

  # .deb and .rpm of the CLI (ANSWERS §304 p. 3), built and installed exactly as the release job `linux-packages` does.
  linux-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.93.0"  # pinned: a floating input can change the build between runs
          targets: ${{ matrix.target }}
      - name: Packaging tools (pinned)
        run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
      - name: Build and package
        run: sh .github/linux_packages.sh ${{ matrix.target }}
      - name: The .deb installs and runs; both packages carry the license files
        run: |
          sudo dpkg -i gridpin/target/${{ matrix.target }}/debian/gridpin_*.deb
          /usr/bin/gridpin --version
          cmp -s /usr/share/doc/gridpin/THIRDPARTY.yml gridpin/THIRDPARTY.yml && test -f /usr/share/doc/gridpin/LICENSE
          command -v rpm >/dev/null || sudo apt-get install -y -qq rpm
          rpm -qlp gridpin/target/${{ matrix.target }}/generate-rpm/gridpin-*.rpm | tee rpm.txt
          grep -qx /usr/bin/gridpin rpm.txt && grep -q LICENSE rpm.txt && grep -q THIRDPARTY.yml rpm.txt

  node:
    # The npm package (integrations/node): Node-API glue over gridpin-ffi, built here on every platform
    # the prebuilt binaries are meant for, and its answers compared with the CLI on the Monaco smoke sheet.
    # The runner's own Node.js (18 or later) is used: the package needs Node-API 8, nothing newer.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.93.0"  # pinned: a floating input can change the build between runs
      - name: Tooling for the smoke sheet (duckdb for prep/)
        run: python3 -m pip install --quiet --break-system-packages duckdb==1.5.3 || python3 -m pip install --quiet duckdb==1.5.3  # pinned: a floating input can change the build between runs
      - name: Node.js version
        run: node --version
      - name: Build the Monaco smoke sheet and the package, run its tests
        run: make test-node

  node-windows:
    # Windows has no `make mc` pipeline here: node-gyp builds the module (it also supplies node.lib, the
    # import library Node-API links against), and the tests that build their own sheet with the CLI run.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.93.0"  # pinned: a floating input can change the build between runs
      - name: Build the CLI and gridpin-ffi
        run: |
          cargo build --release --manifest-path gridpin/Cargo.toml --bin gridpin
          cargo build --release --manifest-path gridpin-ffi/Cargo.toml --lib
      - name: Build the module with node-gyp (bundled with npm)
        working-directory: integrations/node
        run: npm exec --yes --package=node-gyp@12.4.0 -- node-gyp rebuild  # pinned: npm's bundled node-gyp varies with the runner image (11.5 does not know Visual Studio 2026)
      - name: Tests that need no smoke sheet
        working-directory: integrations/node
        run: node --test test/fixture.test.js test/packages.test.js

  duckdb-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.93.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compiler identity for the C++ cache
        id: compiler
        shell: bash
        run: echo "identity=$(c++ --version | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            duckdb-source
            duckdb-ext/build
          key: duckdb-v1.5.5-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('Makefile', 'duckdb-ext/CMakeLists.txt', 'duckdb-ext/extension_config.cmake', 'duckdb-ext/src/**', 'duckdb-ext/Cargo.*', 'gridpin/src/**', 'gridpin/Cargo.*', 'gridpin/build.rs') }}
          restore-keys: |
            duckdb-v1.5.5-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-
      - name: Explicit C++ build, outside the ordinary gate
        shell: bash
        run: |
          if [ ! -d duckdb-source/.git ]; then
            git clone --depth 1 --branch v1.5.5 https://github.com/duckdb/duckdb duckdb-source
          fi
          test "$(git -C duckdb-source describe --tags --exact-match HEAD)" = v1.5.5
          make duckdb-ext DUCKDB_SOURCE_DIR="$PWD/duckdb-source"
      - name: Runtime and test tools
        run: pip install duckdb==1.5.5 pytest==9.1.1 pycountry==24.6.1
      - name: Monaco sheet and C++ extension contracts
        run: |
          make mc
          GRIDPIN_TEST_SHEET="$PWD/data/mc.bin" python -m pytest duckdb-ext/test/test_extension.py -q

  # The MCP server image as the Docker MCP Catalog builds it: from mcp/Dockerfile, for linux/amd64 and
  # linux/arm64. It must build from this commit and, with no network and no configuration, answer MCP
  # introspection with the server's five tools.
  mcp-docker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build the image from mcp/
        run: docker build -t gridpin-mcp mcp/
      - name: The container answers MCP introspection with no network
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          p = subprocess.Popen(["docker", "run", "-i", "--rm", "--network", "none", "gridpin-mcp"],
                               stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          def call(message):
              p.stdin.write(json.dumps(message) + "\n"); p.stdin.flush()
              return json.loads(p.stdout.readline()) if "id" in message else None
          init = call({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
              "protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "ci", "version": "0"}}})
          call({"jsonrpc": "2.0", "method": "notifications/initialized"})
          tools = {t["name"] for t in call({"jsonrpc": "2.0", "id": 2, "method": "tools/list"})["result"]["tools"]}
          listed = call({"jsonrpc": "2.0", "id": 3, "method": "tools/call",
                         "params": {"name": "list_countries", "arguments": {}}})["result"]
          p.stdin.close(); p.wait(timeout=30)
          want = {"list_countries", "download_sheet", "geocode", "reverse", "batch", "extract_addresses"}
          if tools != want:
              sys.exit(f"::error::tools {sorted(tools)} != {sorted(want)}")
          if listed.get("isError"):
              sys.exit(f"::error::list_countries failed: {listed}")
          print("server", init["result"]["serverInfo"]["version"], "answers with", sorted(tools))
          PY

  # The country image of docker/Dockerfile, built from THIS run's binary on both architectures: the
  # Monaco smoke sheet inside, started with no network at all, healthy through `serve --probe`,
  # and then, with a published port, answering /search with the same point as `gridpin query`.
  # Nothing is pushed; the release workflow publishes images from the signed release archive.
  server-docker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.93.0"  # pinned: a floating input can change the build between runs
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: gridpin
      - name: Build the CLI
        run: cargo build --release --manifest-path gridpin/Cargo.toml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the Monaco smoke sheet
        # Not a release sheet: the registry names the release being prepared, whose sheets reach
        # dl.gridpin.dev only after the tag (0.7.1 snapshot, run 41615795783). The release `docker` job
        # builds every country image from the published sheets.
        run: |
          pip install duckdb==1.5.3  # pinned: a floating input can change the build between runs
          make mc
      - name: Build context (binary, legal files, the Monaco smoke sheet)
        run: |
          cp gridpin/THIRDPARTY.yml THIRDPARTY.yml
          python3 docker/context.py --binary gridpin/target/release/gridpin --legal-dir . --out ctx --sheet data/mc.bin --sheet-country mc > args.env
          cat args.env
      - name: Build the image
        run: |
          set -a; . ./args.env; set +a
          docker build --target country --build-arg VERSION=ci --build-arg SHEET --build-arg COUNTRY \
            --build-arg SHEET_SHA256 --build-arg SHEET_RELEASE -t gridpin:mc -f docker/Dockerfile ctx
          docker image inspect gridpin:mc --format '{{.Size}} bytes, user {{.Config.User}}'
      - name: Healthy with no network
        run: |
          docker run -d --rm --name offline --network none gridpin:mc
          for i in $(seq 1 60); do
            docker exec offline /usr/local/bin/gridpin serve --probe http://127.0.0.1:8080/health && break
            sleep 2
          done
          docker exec offline /usr/local/bin/gridpin serve --probe http://127.0.0.1:8080/health
          docker logs offline
          docker stop offline
      - name: Answers /search like gridpin query
        run: |
          docker run -d --rm --name online -p 127.0.0.1:8080:8080 gridpin:mc
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/health >/dev/null && break; sleep 2; done
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          q = "6 Rue Grimaldi Monaco"
          cli = json.loads(subprocess.check_output(
              ["gridpin/target/release/gridpin", "query", "ctx/mc.bin", q, "-k", "1"], text=True).splitlines()[0])
          url = "http://127.0.0.1:8080/search?" + urllib.parse.urlencode({"q": q, "format": "json", "limit": 1})
          got = json.load(urllib.request.urlopen(url, timeout=30))[0]
          want = (f"{cli['lat']:.7f}", f"{cli['lon']:.7f}")
          if (got["lat"], got["lon"]) != want:
              raise SystemExit(f"::error::container {got['lat']},{got['lon']} != gridpin query {want}")
          print("container answers", got["display_name"], got["lat"], got["lon"])
          PY
          docker stop online

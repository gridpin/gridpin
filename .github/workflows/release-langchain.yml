# langchain-gridpin release: on a langchain-vX.Y.Z tag, build the pure-Python package in
# integrations/langchain/ and publish it to PyPI. Publishing needs a manual approval (the "pypi"
# environment has a required reviewer), so a tag alone never publishes anything. Engine releases
# (release.yml, tags v*) and gridpin-mcp releases (release-mcp.yml, tags mcp-v*) are separate:
# "langchain-v0.1.0" matches neither.
name: release-langchain

on:
  push:
    tags: ["langchain-v*"]

# Read-only by default; `id-token: write` (OIDC) is granted ONLY to the publish job.
permissions:
  contents: read

jobs:
  # Fuse: the tag must match every place that states the package version.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Tag matches pyproject.toml and __init__.py
        run: |
          tag="${GITHUB_REF_NAME#langchain-v}"
          py_v=$(grep -m1 '^version' integrations/langchain/pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          init_v=$(grep -m1 '^__version__' integrations/langchain/src/langchain_gridpin/__init__.py | sed 's/.*"\(.*\)"/\1/')
          echo "tag=$tag pyproject=$py_v __init__=$init_v"
          for v in "$py_v" "$init_v"; do
            [ "$tag" = "$v" ] || { echo "::error::tag langchain-v$tag disagrees with a package version ($v)"; exit 1; }
          done

  ci-passed:
    # Same rule as release.yml: only a successful ci.yml run from a push to main of THIS repository
    # proves the tagged commit was tested; a PR, fork or branch run does not count.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a successful push-to-main CI run for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
                --jq '[.workflow_runs[]
                       | select(.status=="completed" and .conclusion=="success"
                                and .event=="push" and .head_branch=="main"
                                and .head_repository.full_name==env.REPO)] | length')
          echo "trusted (push->main, this repo) successful ci.yml runs for $SHA: ${n:-0}"
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::no successful ci.yml run from a push to main of $REPO for $SHA"; exit 1
          fi

  # Build, test the built wheel, then publish with Trusted Publishing (OIDC): PyPI verifies the
  # workflow identity and issues a short-lived token, no long-lived secret exists.
  # One-time setup on PyPI: Publishing -> add a pending GitHub publisher for project
  # "langchain-gridpin" (owner gridpin, repo gridpin, workflow release-langchain.yml, environment pypi).
  pypi:
    needs: [check, ci-passed]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build==1.3.0 twine==6.2.0  # pinned build inputs
          python -m build --outdir dist integrations/langchain
          python -m twine check --strict dist/*
      - name: The wheel and the sdist ship LICENSE
        # setuptools only warns when a `license-files` entry matches nothing and still builds both
        # archives without it, and `twine check --strict` passes them. So the archives themselves
        # are checked: the wheel carries .dist-info/licenses/LICENSE byte for byte the committed
        # integrations/langchain/LICENSE and installs nothing at the top of site-packages; the sdist
        # carries the same LICENSE at its root.
        run: |
          python - <<'PY'
          import glob, re, sys, tarfile, zipfile
          with open("integrations/langchain/LICENSE", "rb") as f:
              committed = f.read()
          wheels, sdists = glob.glob("dist/*.whl"), glob.glob("dist/*.tar.gz")
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f"::error::expected one wheel and one sdist in dist/, got {wheels + sdists}")
          z = zipfile.ZipFile(wheels[0])
          names = z.namelist()
          lic = [n for n in names if re.fullmatch(r"langchain_gridpin-[^/]+\.dist-info/licenses/LICENSE", n)]
          if len(lic) != 1 or z.read(lic[0]) != committed:
              sys.exit(f"::error::{wheels[0]} lacks .dist-info/licenses/LICENSE equal to integrations/langchain/LICENSE; entries={names}")
          top = [n for n in names if "/" not in n]
          if top:
              sys.exit(f"::error::{wheels[0]} installs files at the top of site-packages: {top}")
          with tarfile.open(sdists[0]) as t:
              members = {m.name: m for m in t.getmembers() if m.isfile()}
              src = [n for n in members if re.fullmatch(r"langchain_gridpin-[^/]+/LICENSE", n)]
              if len(src) != 1 or t.extractfile(members[src[0]]).read() != committed:
                  sys.exit(f"::error::{sdists[0]} lacks a root LICENSE equal to integrations/langchain/LICENSE")
          print("license files:", lic[0], src[0])
          PY
      # The built wheel with its published dependencies (gridpin-mcp and the gridpin engine from
      # PyPI). Tests that need the Monaco smoke sheet skip here; they run in ci.yml
      # (make test-langchain), which ci-passed already requires.
      - name: Test the built wheel
        run: |
          python -m pip install --quiet dist/*.whl -r integrations/langchain/requirements-test.txt
          python -c "import langchain_gridpin, sys; sys.exit(0 if 'site-packages' in langchain_gridpin.__file__ else 'tests would import the source tree, not the wheel')"
          python -m pytest integrations/langchain/tests -q -p no:cacheprovider -p no:benchmark
      - name: Publish (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist

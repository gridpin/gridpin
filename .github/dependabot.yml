# Version-update pull requests are disabled (open-pull-requests-limit: 0): this public repository is a mirror
# of the GridPin source tree, and dependencies are updated there and released after the full test gate, so
# pull requests opened here are never merged. GitHub security alerts and `cargo deny` in CI still apply.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: cargo
    directory: "/gridpin"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: cargo
    directory: "/duckdb-ext"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

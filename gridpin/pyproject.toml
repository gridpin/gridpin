[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "gridpin"
version = "0.5.0"
description = "Offline forward and reverse geocoder: country files, no server or database import, no per-request fees; queries stay local"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
# Both go to .dist-info/licenses/ in the wheel and into the sdist: the Apache license, and the license
# texts of the Rust libraries compiled into the extension module (`make third-party-licenses`).
license-files = ["LICENSE", "THIRDPARTY.yml"]
keywords = ["geocoding", "geocoder", "offline", "reverse-geocoding", "gis", "overture", "openstreetmap"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://gridpin.dev"
Documentation = "https://gridpin.dev/docs"
Benchmark = "https://gridpin.dev/bench"
Repository = "https://github.com/gridpin/gridpin"
Issues = "https://github.com/gridpin/gridpin/issues"

[tool.maturin]
features = ["python"]

[package]
name = "gridpin"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Offline geocoder: addresses to coordinates from a country sheet"
homepage = "https://gridpin.dev"

# Linux packages of the CLI (cargo deb, cargo generate-rpm); the sheets are not packaged: `gridpin sheets fetch`.
[package.metadata.deb]
maintainer = "GridPin <hello@gridpin.dev>"
section = "utils"
assets = [["target/release/gridpin", "usr/bin/", "755"], ["LICENSE", "usr/share/doc/gridpin/", "644"],
          ["THIRDPARTY.yml", "usr/share/doc/gridpin/", "644"]]

[package.metadata.generate-rpm]
assets = [{ source = "target/release/gridpin", dest = "/usr/bin/gridpin", mode = "755" },
          { source = "LICENSE", dest = "/usr/share/doc/gridpin/LICENSE", mode = "644", doc = true },
          { source = "THIRDPARTY.yml", dest = "/usr/share/doc/gridpin/THIRDPARTY.yml", mode = "644", doc = true }]

[lib]
name = "gridpin"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gridpin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake2 = "0.10"
clap = { version = "4", features = ["derive"] }
csv = "1"
flate2 = "1"
h3o = { version = "0.11", default-features = false }
fst = { version = "0.4", features = ["levenshtein"] }
memmap2 = "0.9"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"], optional = true }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"

[features]
default = []
python = ["dep:pyo3"]

[profile.release]
lto = "thin"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("watermark"))'] }

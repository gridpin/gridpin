[package]
name = "gridpin-ffi"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
description = "C interface to the GridPin offline geocoder, shared by the DuckDB extension and the R package"
publish = false

[lib]
name = "gridpin_ffi"
crate-type = ["rlib", "staticlib"]

[dependencies]
gridpin = { path = "../gridpin" }
serde = "1"
serde_json = "1"

[features]
# extra answer fields (`gridpin_invoke_with`); off in the copies the DuckDB extension and the R package
# build against the released engine, which does not have them yet
default = ["extras"]
extras = []

[profile.release]
lto = "thin"
